<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Игра «Оборона Москвы»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Layout: one narrow column like a field notebook; index cards on a grey-green map-paper ground, handwriting only for headings */
:root{
  --ground:#e6e9e2; --card:#fbfcf8; --ink:#1d1f1c; --muted:#5d645b; --line:#c9cfc4;
  --accent:#2f4a3a; --accent-soft:#dfe8dd; --ok:#2e6b3f; --ok-soft:#d7eadb; --bad:#a2342a; --bad-soft:#f3dcd8;
  --hand:"Caveat","Segoe Print",cursive;
  --text:"PT Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#1b1e1a; --card:#262a25; --ink:#e7eae3; --muted:#a3ab9f; --line:#3d443b;
  --accent:#9cc3a8; --accent-soft:#2c3a30; --ok:#8fd19f; --ok-soft:#24392a; --bad:#ef9488; --bad-soft:#4a2a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#1b1e1a; --card:#262a25; --ink:#e7eae3; --muted:#a3ab9f; --line:#3d443b;
  --accent:#9cc3a8; --accent-soft:#2c3a30; --ok:#8fd19f; --ok-soft:#24392a; --bad:#ef9488; --bad-soft:#4a2a26; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font:16px/1.45 var(--text);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:2px}
h1{font:700 2.3rem/1 var(--hand);margin:0;text-wrap:balance}
h2{font:700 1.75rem/1.1 var(--hand);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:6px;padding:11px 16px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.ghost{border-color:var(--line);font-weight:400;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.back{align-self:flex-start;border:none;background:none;color:var(--muted);padding:4px 0;font-size:.95rem}

/* home */
.modes{display:grid;gap:12px}
.mode{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;border:1.5px solid var(--ink);background:var(--card);border-radius:8px;padding:16px;box-shadow:3px 3px 0 var(--line)}
.mode b{font:700 1.6rem/1 var(--hand)}
.mode span{color:var(--muted);font-size:.92rem;grid-column:1}
.mode .stars{grid-row:1/3;grid-column:2}
.rounds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.round{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.round b{font-weight:700}
.round small{color:var(--muted)}
.stars{font-size:1.05rem;letter-spacing:2px;color:var(--line);white-space:nowrap}
.stars i{font-style:normal}
.stars i.on{color:var(--accent)}

/* flash cards */
.deck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.flash{position:relative;min-height:92px;border:1.5px solid var(--ink);background:var(--card);border-radius:6px;padding:14px 12px 12px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:4px;
  background-image:linear-gradient(var(--card) 26px,var(--bad-soft) 26px,var(--bad-soft) 27.5px,var(--card) 27.5px)}
.flash .de{font-weight:700;overflow-wrap:anywhere}
.flash .ru{color:var(--accent);font-size:.95rem}
.flash .hint{color:var(--muted);font-size:.78rem}
.flash.open{border-color:var(--accent)}
.say{position:absolute;top:4px;right:4px;width:30px;height:30px;border:none;background:none;color:var(--muted);display:grid;place-items:center;border-radius:50%}
.say svg{width:17px;height:17px}

/* pairs */
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:10px;min-height:56px;text-align:left;overflow-wrap:anywhere;transition:opacity .25s,background .15s,border-color .15s}
.tile.de{font-weight:700}
.tile.sel{border-color:var(--ink);background:var(--accent-soft)}
.tile.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);opacity:.55;pointer-events:none}
.tile.wrong,.ev.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.status{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}

/* timeline */
.line{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--ink);margin-left:6px;padding-left:16px;min-height:24px}
.line:empty::before{content:"Здесь появятся события по порядку";color:var(--muted);font-size:.9rem}
.placed{position:relative;padding:6px 0 10px}
.placed::before{content:"";position:absolute;left:-23px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.placed .date{font:700 1.25rem/1 var(--hand);color:var(--accent)}
.placed .de{display:block}
.placed .ru{display:block;color:var(--muted);font-size:.9rem}
.pool{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;border:1.5px solid var(--ink);background:var(--card);border-radius:6px;padding:11px 10px 11px 12px;text-align:left}
.ev .ru{grid-column:1/-1;color:var(--accent);font-size:.92rem;border-top:1px dashed var(--line);padding-top:6px}
.tr{border:1px solid var(--line);background:var(--ground);border-radius:4px;font-size:.75rem;font-weight:700;padding:3px 7px;color:var(--muted)}

.result{border:1.5px solid var(--ink);background:var(--card);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:3px 3px 0 var(--line)}
.result .stars{font-size:1.8rem}
footer{color:var(--muted);font-size:.8rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const ROUNDS=[
 {name:'Раунд 1 · Война',words:[
  ['der Krieg','война'],['der Feind','враг'],['der Soldat','солдат'],
  ['der Panzer','танк'],['erobern','завоевать, захватить'],['die Heimat schützen','защищать Родину']]},
 {name:'Раунд 2 · Наступление',words:[
  ['die Truppen','войска'],['durchbrechen','прорваться'],['einnehmen','взять, занять (город)'],
  ['die Fernkampfwaffen','оружие дальнего действия'],['beschießen','обстреливать'],['bedrohlich','угрожающий, опасный']]},
 {name:'Раунд 3 · Оборона',words:[
  ['die Verteidigung','оборона, защита'],['die Schützenbrigade','стрелковая бригада'],['den Befehl bekommen','получить приказ'],
  ['den Vormarsch stoppen','остановить наступление'],['keinen Schritt weiterkommen','не продвинуться ни на шаг'],['der Verteidigungspunkt','узел обороны']]},
 {name:'Раунд 4 · Победа и память',words:[
  ['die Gegenoffensive','контрнаступление'],['harte Kämpfe','ожесточённые бои'],['die Unterstützung','поддержка'],
  ['ausschlagen','выбить (врага)'],['das Massengrab','братская могила'],['das Denkmal','памятник']]}
];
const EVENTS=[
 ['Okt.–Nov. 1941','Der Feind will Moskau erobern.','Враг хочет захватить Москву.'],
 ['30. Nov. 1941','Deutsche Panzer brechen durch und nehmen Krasnaja Poljana ein.','Немецкие танки прорываются и занимают Красную Поляну.'],
 ['Ende Nov. 1941','Aus Krasnaja Poljana beschießt der Feind Moskau. Bis Moskau sind es nur 30 km.','Из Красной Поляны враг обстреливает Москву. До Москвы всего 30 км.'],
 ['In diesen Tagen','Die 28. Brigade (Oberst Gritzenko) bekommt den Befehl: Der Feind darf nicht näher an Moskau!','28-я бригада (полковник Гриценко) получает приказ: не подпустить врага ближе к Москве!'],
 ['Anfang Dez. 1941','Bei Lobnja stoppen die Soldaten den Vormarsch. Der Feind kommt keinen Schritt weiter.','У Лобни солдаты останавливают наступление. Враг не продвигается ни на шаг.'],
 ['5./6. Dez. 1941','In der Nacht beginnt die Gegenoffensive der Roten Armee.','Ночью начинается контрнаступление Красной армии.'],
 ['8. Dez. 1941','Mit Unterstützung von Panzern schlagen die Soldaten den Feind aus Krasnaja Poljana aus.','При поддержке танков солдаты выбивают врага из Красной Поляны.'],
 ['Winter 1941–1942','Die 28. Brigade kämpft sich 400 km nach Westen – bis Smolensk.','28-я бригада с боями проходит 400 км на запад, до Смоленска.'],
 ['Heute','Denkmäler bei Lobnja, Katjuschki und Belyj Rast erinnern an die gefallenen Soldaten.','Памятники у Лобни, Катюшек и Белого Раста напоминают о павших солдатах.']
];

const KEY='moskau1941-spiel';
let save={rounds:{},timeline:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save=Object.assign(save,s)}catch(e){}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};

const app=document.getElementById('app');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const stars=n=>`<span class="stars" aria-label="${n} из 3">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}">★</i>`).join('')}</span>`;
const rate=m=>m===0?3:m<=2?2:1;
const SPEAK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const toTop=()=>window.scrollTo({top:0});

function home(){
  const total=ROUNDS.reduce((s,_,i)=>s+(save.rounds[i]||0),0);
  app.innerHTML=`
  <header><span class="eyebrow">Лобня · Красная Поляна · 1941</span><h1>Оборона Москвы</h1>
  <p class="sub">Учим немецкие слова и события с карты</p></header>
  <div class="modes">
   <button class="mode" id="m-words"><b>Слова</b><span>24 слова, 4 раунда: сначала карточки, потом найди пары</span>${stars(Math.round(total/4))}</button>
   <button class="mode" id="m-time"><b>Хронология</b><span>9 событий: расставь их по порядку</span>${stars(save.timeline||0)}</button>
  </div>
  <footer>Нажми на немецкий текст — увидишь перевод</footer>`;
  app.querySelector('#m-words').onclick=rounds;
  app.querySelector('#m-time').onclick=timeline;
  toTop();
}

function rounds(){
  app.innerHTML=`<button class="back" id="bk">← В меню</button>
  <header><h2>Слова</h2><p class="sub">Выбери раунд</p></header>
  <div class="rounds">${ROUNDS.map((r,i)=>`<button class="round" data-i="${i}"><b>${esc(r.name.split(' · ')[0])}</b><small>${esc(r.name.split(' · ')[1])}</small>${stars(save.rounds[i]||0)}</button>`).join('')}</div>`;
  app.querySelector('#bk').onclick=home;
  app.querySelectorAll('.round').forEach(b=>b.onclick=()=>cards(+b.dataset.i));
  toTop();
}

function cards(ri){
  const r=ROUNDS[ri];
  app.innerHTML=`<button class="back" id="bk">← Раунды</button>
  <header><span class="eyebrow">${esc(r.name)} · шаг 1 из 2</span><h2>Запомни слова</h2><p class="sub">Нажми на карточку — увидишь перевод</p></header>
  <div class="deck">${r.words.map(([de,ru],i)=>`<div class="flash" role="button" tabindex="0" data-i="${i}"><button class="say" aria-label="Произнести" data-t="${esc(de)}">${SPEAK}</button><span class="de">${esc(de)}</span><span class="hint">перевод ↓</span><span class="ru" hidden>${esc(ru)}</span></div>`).join('')}</div>
  <div class="row"><button class="btn primary" id="go">Найти пары →</button></div>`;
  app.querySelector('#bk').onclick=rounds;
  app.querySelectorAll('.flash').forEach(c=>{
    const flip=()=>{const o=c.classList.toggle('open');c.querySelector('.ru').hidden=!o;c.querySelector('.hint').hidden=o};
    c.onclick=flip;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  });
  app.querySelectorAll('.say').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.t)});
  app.querySelector('#go').onclick=()=>pairs(ri);
  toTop();
}

function pairs(ri){
  const r=ROUNDS[ri];let miss=0,left=r.words.length,pick={de:null,ru:null};
  const L=shuffle(r.words.map((w,i)=>[i,w[0]])),R=shuffle(r.words.map((w,i)=>[i,w[1]]));
  app.innerHTML=`<button class="back" id="bk">← Карточки</button>
  <header><span class="eyebrow">${esc(r.name)} · шаг 2 из 2</span><h2>Найди пары</h2><p class="sub">Нажми слово слева и его перевод справа</p></header>
  <div class="status"><span id="left">Осталось: ${left}</span><span id="miss">Ошибок: 0</span></div>
  <div class="pairs"><div class="col">${L.map(([i,t])=>`<button class="tile de" data-k="de" data-i="${i}">${esc(t)}</button>`).join('')}</div>
  <div class="col">${R.map(([i,t])=>`<button class="tile ru" data-k="ru" data-i="${i}">${esc(t)}</button>`).join('')}</div></div>`;
  app.querySelector('#bk').onclick=()=>cards(ri);
  app.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    const k=t.dataset.k;
    if(k==='de')speak(t.textContent);
    if(pick[k])pick[k].classList.remove('sel');
    pick[k]=t;t.classList.add('sel');
    if(pick.de&&pick.ru){
      const a=pick.de,b=pick.ru;pick={de:null,ru:null};
      a.classList.remove('sel');b.classList.remove('sel');
      if(a.dataset.i===b.dataset.i){a.classList.add('done');b.classList.add('done');left--}
      else{miss++;[a,b].forEach(x=>{x.classList.remove('wrong');void x.offsetWidth;x.classList.add('wrong');setTimeout(()=>x.classList.remove('wrong'),400)})}
      app.querySelector('#left').textContent='Осталось: '+left;
      app.querySelector('#miss').textContent='Ошибок: '+miss;
      if(!left)setTimeout(()=>roundDone(ri,miss),450);
    }
  });
  toTop();
}

function roundDone(ri,miss){
  const s=rate(miss);save.rounds[ri]=Math.max(save.rounds[ri]||0,s);store();
  const next=ri+1<ROUNDS.length;
  app.innerHTML=`<div class="result"><span class="eyebrow">${esc(ROUNDS[ri].name)}</span><h2>${s===3?'Без ошибок!':'Раунд пройден'}</h2>${stars(s)}
  <p class="sub">Ошибок: ${miss}</p>
  <div class="row">${next?`<button class="btn primary" id="nx">Следующий раунд →</button>`:`<button class="btn primary" id="tl">К хронологии →</button>`}<button class="btn" id="again">Ещё раз</button><button class="btn ghost" id="menu">В меню</button></div></div>`;
  if(next)app.querySelector('#nx').onclick=()=>cards(ri+1);else app.querySelector('#tl').onclick=timeline;
  app.querySelector('#again').onclick=()=>cards(ri);
  app.querySelector('#menu').onclick=home;
  toTop();
}

function timeline(){
  let next=0,miss=0;
  const order=shuffle(EVENTS.map((_,i)=>i));
  app.innerHTML=`<button class="back" id="bk">← В меню</button>
  <header><h2>Хронология</h2><p class="sub">Нажимай события по порядку: от самого раннего к позднему. «RU» — перевод.</p></header>
  <div class="status"><span id="cnt">0 из ${EVENTS.length}</span><span id="miss">Ошибок: 0</span></div>
  <div class="line" id="line"></div>
  <div class="pool" id="pool">${order.map(i=>`<div class="ev" role="button" tabindex="0" data-i="${i}"><span class="de">${esc(EVENTS[i][1])}</span><button class="tr" aria-label="Перевод">RU</button><span class="ru" hidden>${esc(EVENTS[i][2])}</span></div>`).join('')}</div>`;
  app.querySelector('#bk').onclick=home;
  const line=app.querySelector('#line');
  app.querySelectorAll('.ev').forEach(ev=>{
    ev.querySelector('.tr').onclick=e=>{e.stopPropagation();const r=ev.querySelector('.ru');r.hidden=!r.hidden};
    const choose=()=>{
      const i=+ev.dataset.i;
      if(i===next){
        const [d,de,ru]=EVENTS[i];
        line.insertAdjacentHTML('beforeend',`<div class="placed"><span class="date">${esc(d)}</span><span class="de">${esc(de)}</span><span class="ru">${esc(ru)}</span></div>`);
        ev.remove();next++;
        app.querySelector('#cnt').textContent=next+' из '+EVENTS.length;
        if(next===EVENTS.length){
          const s=rate(miss);save.timeline=Math.max(save.timeline||0,s);store();
          app.querySelector('#pool').innerHTML=`<div class="result"><h2>${s===3?'Без ошибок!':'Готово!'}</h2>${stars(s)}<p class="sub">Ошибок: ${miss}. Прочитай ленту ещё раз сверху вниз.</p>
          <div class="row"><button class="btn primary" id="again">Ещё раз</button><button class="btn ghost" id="menu">В меню</button></div></div>`;
          app.querySelector('#again').onclick=timeline;app.querySelector('#menu').onclick=home;
        }
      }else{
        miss++;app.querySelector('#miss').textContent='Ошибок: '+miss;
        ev.classList.remove('wrong');void ev.offsetWidth;ev.classList.add('wrong');setTimeout(()=>ev.classList.remove('wrong'),400);
      }
    };
    ev.onclick=choose;ev.onkeydown=e=>{if(e.target===ev&&(e.key==='Enter'||e.key===' ')){e.preventDefault();choose()}};
  });
  toTop();
}

home();
</script>
</body>
</html>
